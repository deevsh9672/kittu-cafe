version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kittu_cafe_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kittu_cafe
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: kittu_cafe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: kittu_cafe_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://mongodb:27017/kittu_cafe
      REDIS_URL: redis://redis:6379
      JWT_SECRET: kittu_cafe_production_super_secret_jwt_key_dausa_2026
      JWT_EXPIRES_IN: 7d
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
    depends_on:
      - mongodb
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kittu_cafe_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
